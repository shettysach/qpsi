[project]
name = "qpsi-baseline"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "torch==2.7.0",
    "torchvision==0.22.0",
    "transformers==4.57.1",
    "diffusers==0.37.0",
    "qwen-vl-utils==0.0.14",
    "safetensors==0.6.2",
    "numpy==1.26.4",
    "pillow==11.3.0",
    "pydantic==2.10.6",
    "tyro==0.9.32",
    "tqdm==4.67.1",
    "einops==0.8.1",
    "av==15.0.0",
    "pyarrow==20.0.0",
    "matplotlib==3.10.6",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
